[workspace]
members = [
    "proxynexus-cli",
    "proxynexus-core",
    "proxynexus-gui",
]
default-members = ["proxynexus-gui"]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.local]
inherits = "release"
lto = false
codegen-units = 16
incremental = true